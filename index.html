<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Ый кыыһа — Дочь Луны</title>
<style>
  :root{
    --bg1:#0b1026; --bg2:#141b3c; --bg3:#1d2a55;
    --moon:#f7f3e8; --gold:#e8c37a; --text:#e9edf7; --muted:#a9b4cf;
    --pad: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family: Georgia,"Times New Roman",serif;
    color:var(--text);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg3) 0%, var(--bg2) 45%, var(--bg1) 100%);
    overflow:hidden;
  }

  /* ── Звёзды ───────────────────────────── */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars.a{
    background-image:
      radial-gradient(1.4px 1.4px at 18px 26px, #fff, transparent 60%),
      radial-gradient(1px 1px at 120px 70px, #fff, transparent 60%),
      radial-gradient(1.2px 1.2px at 60px 150px, #fff, transparent 60%),
      radial-gradient(1px 1px at 175px 190px, #fff, transparent 60%),
      radial-gradient(1.6px 1.6px at 30px 210px, #fff, transparent 60%);
    background-size:220px 220px;
    animation:tw 5s ease-in-out infinite;
  }
  .stars.b{
    background-image:
      radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(1.3px 1.3px at 200px 120px, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(1px 1px at 20px 100px, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1.1px 1.1px at 150px 20px, rgba(255,255,255,.6), transparent 60%);
    background-size:260px 260px;
    animation:tw 7s ease-in-out infinite reverse;
    opacity:.75;
  }
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

  .shooting{
    position:fixed;top:12%;left:-10%;width:130px;height:2px;z-index:0;
    background:linear-gradient(90deg,transparent,#fff);
    border-radius:2px;filter:drop-shadow(0 0 6px #fff);
    opacity:0;transform:rotate(18deg);
    animation:shoot 11s linear infinite;
  }
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(18deg)}
    6%{opacity:1}
    16%{opacity:0;transform:translate(120vw,45vh) rotate(18deg)}
    100%{opacity:0;transform:translate(120vw,45vh) rotate(18deg)}
  }

  /* ── Луна ─────────────────────────────── */
  .moon{
    position:fixed;top:9%;right:8%;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #fffdf5 0%, #f2ecd8 55%, #d8d0b8 100%);
    box-shadow:0 0 40px 12px rgba(247,243,232,.35), 0 0 120px 40px rgba(150,170,255,.18);
    z-index:0;animation:float 6s ease-in-out infinite;
  }
  .moon::before,.moon::after{
    content:"";position:absolute;border-radius:50%;background:rgba(0,0,0,.07)
  }
  .moon::before{width:26px;height:26px;top:34%;left:24%}
  .moon::after{width:16px;height:16px;top:60%;left:58%}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  /* ── Холмы ────────────────────────────── */
  .hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:26vh;z-index:0;display:block}

  /* ── Главная ──────────────────────────── */
  .landing{
    position:relative;z-index:2;height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px 22px calc(24px + var(--pad));
    animation:fade 1.2s ease both;
  }
  .kicker{
    font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold);opacity:.9;margin-bottom:14px;
  }
  h1{
    font-size:clamp(2.6rem,11vw,5rem);font-weight:400;line-height:1.05;
    letter-spacing:.02em;
    background:linear-gradient(180deg,#fffdf6 0%,#f0e6cd 55%,#cbb98d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(255,246,214,.25);
  }
  .subtitle{
    margin-top:10px;font-style:italic;color:var(--muted);
    font-size:clamp(1rem,4vw,1.3rem);letter-spacing:.12em;
  }
  .divider{
    margin:22px 0;color:var(--gold);opacity:.75;
    font-size:.9rem;letter-spacing:.5em;
  }
  .lead{
    max-width:34ch;color:#cfd6e8;line-height:1.85;
    font-size:clamp(.95rem,3.6vw,1.1rem);margin-bottom:30px;
  }
  .btn{
    position:relative;overflow:hidden;cursor:pointer;
    font-family:inherit;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;
    color:#1a1408;padding:16px 42px;border:none;border-radius:999px;
    background:linear-gradient(135deg,#f4e3b8 0%,#e0b96a 100%);
    box-shadow:0 10px 30px rgba(224,185,106,.35), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(224,185,106,.5)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:shine 3.5s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .hint{margin-top:18px;font-size:.78rem;color:#8d99b8;letter-spacing:.06em}

  /* ── Читалка ──────────────────────────── */
  .reader{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:var(--bg1)}
  .reader.on{display:flex;animation:fade .6s ease both}
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
    background:rgba(11,16,38,.92);border-bottom:1px solid rgba(232,195,122,.18);
    backdrop-filter:blur(8px);
  }
  .back{
    cursor:pointer;font-family:inherit;font-size:.9rem;color:var(--text);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    padding:9px 16px;border-radius:999px;transition:background .2s;
  }
  .back:hover{background:rgba(255,255,255,.16)}
  .top-title{flex:1;text-align:center;color:var(--gold);letter-spacing:.22em;font-size:.85rem}
  .frame-wrap{position:relative;flex:1;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block;background:var(--bg1)}
  .loader{
    position:absolute;inset:0;display:grid;place-items:center;
    color:var(--muted);font-size:.85rem;letter-spacing:.2em;background:var(--bg1);
    transition:opacity .5s ease;
  }
  .loader.off{opacity:0;pointer-events:none}
  .loader span{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (max-width:420px){ .moon{width:82px;height:82px;top:6%} }
</style>
</head>
<body>

  <div class="stars a"></div>
  <div class="stars b"></div>
  <div class="shooting"></div>
  <div class="moon"></div>

  <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,150 C180,80 330,190 520,135 C700,85 860,180 1040,145 C1220,112 1330,180 1440,145 L1440,220 L0,220 Z" fill="rgba(9,13,30,.55)"/>
    <path d="M0,190 C220,148 380,215 620,183 C820,158 1000,214 1200,188 C1320,172 1390,200 1440,190 L1440,220 L0,220 Z" fill="rgba(5,8,20,.9)"/>
  </svg>

  <!-- ГЛАВНАЯ -->
  <main class="landing" id="landing">
    <p class="kicker">Якутская легенда</p>
    <h1>Ый кыыһа</h1>
    <p class="subtitle">Дочь Луны</p>
    <div class="divider">✦ ❖ </div>
    <p class="lead">
      Поздней осенью девочка-сирота пошла за водой.
      Луна светила вовсю — и услышала её слово.
    </p>
    <button class="btn" id="startBtn">Начать историю</button>
    <p class="hint">11 сцен · с видео · включите звук 🔊</p>
  </main>

  <!-- ИСТОРИЯ -->
  <section class="reader" id="reader">
    <div class="topbar">
      <button class="back" id="backBtn">← Назад</button>
      <span class="top-title">ЫЙ КЫЫҺА</span>
      <span style="width:70px"></span>
    </div>
    <div class="frame-wrap">
      <div class="loader" id="loader"><span>ЗАГРУЗКА…</span></div>
      <iframe id="frame" title="Ый кыыһа" allow="fullscreen"></iframe>
    </div>
  </section>

<script>
  const landing = document.getElementById('landing');
  const reader  = document.getElementById('reader');
  const frame   = document.getElementById('frame');
  const loader  = document.getElementById('loader');
  let loaded = false;

  function openStory(){
    reader.classList.add('on');
    landing.style.display = 'none';
    if(!loaded){ frame.src = 'story.html'; }   // грузим один раз
    window.scrollTo(0,0);
  }
  function closeStory(){
    reader.classList.remove('on');
    landing.style.display = 'flex';
    frame.src = 'about:blank';                  // останавливаем видео и звук
    loaded = false;
  }

  frame.addEventListener('load', () => {
    if(frame.src.includes('about:blank')) return;
    loaded = true;
    loader.classList.add('off');
  });

  document.getElementById('startBtn').addEventListener('click', openStory);
  document.getElementById('backBtn').addEventListener('click', closeStory);
  document.querySelector('.moon').addEventListener('click', openStory);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeStory(); });
</script>
<!-- Фоновая музыка -->
<audio id="bgMusic" loop preload="auto">
  <source src="music/main.mp3" type="audio/mpeg">
</audio>

<!-- Кнопка звука -->
<button id="muteBtn" style="
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(232,195,122,0.4);
  color: #e8c37a;
  font-size: 24px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
">🔊</button>

<script>
  const bgMusic = document.getElementById('bgMusic');
  const muteBtn = document.getElementById('muteBtn');
  let isMuted = false;

  // Запускаем музыку при клике на кнопку "Начать историю"
  document.querySelector('.btn').addEventListener('click', () => {
    bgMusic.volume = 0.4;
    bgMusic.play().catch(e => console.log('Автоплей заблокирован'));
  });

  // Также запускаем при клике по луне
  document.querySelector('.moon').addEventListener('click', () => {
    bgMusic.volume = 0.4;
    bgMusic.play().catch(e => console.log('Автоплей заблокирован'));
  });

  // Кнопка mute/unmute
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    bgMusic.muted = isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
    muteBtn.style.background = isMuted ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.15)';
  });
</script>
</body>
</html>
